<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Escola</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho -->
    <header>
        <div class="cabecalho-itens">
            <img class="cabecalho_imagem" src="logo_nossa_escola.png" alt="Logo da escola">

            <h1 class="titulo_site">Nossa Escola</h1>

            <div class="sociais">
                <img src="whatsapp.png" alt="WhatsApp">
                <img src="instagram.png" alt="Instagram">
                <img src="facebook.png" alt="Facebook">
            </div>
        </div>
    </header>

    <!-- Banner -->
    <section class="banner1">
        <img class="banner-img" src="paragrafo_1_banner.jpg" alt="Banner da escola">
    </section>

    <!-- Alunos em destaque -->
    <section class="estudante">
        <h2 class="estudante_titulo">Alunos em destaque 2025</h2>

        <div class="estudantes_todos">

            <div class="estudante-div">
                <img class="estudante-imagem" src="estudante_menino.png" alt="Aluno 1">
                <h3 class="estudante-nome">Aluno 1</h3>
                <div>
                    <img class="estudante-icone" src="instagram.png" alt="Instagram">
                    <img class="estudante-icone" src="facebook.png" alt="Facebook">
                </div>
            </div>

            <div class="estudante-div">
                <img class="estudante-imagem" src="estudante_menina.png" alt="Aluno 2">
                <h3 class="estudante-nome">Aluno 2</h3>
                <div>
                    <img class="estudante-icone" src="instagram.png" alt="Instagram">
                    <img class="estudante-icone" src="facebook.png" alt="Facebook">
                </div>
            </div>

            <div class="estudante-div">
                <img class="estudante-imagem" src="estudante_menino.png" alt="Aluno 3">
                <h3 class="estudante-nome">Aluno 3</h3>
                <div>
                    <img class="estudante-icone" src="instagram.png" alt="Instagram">
                    <img class="estudante-icone" src="facebook.png" alt="Facebook">
                </div>
            </div>

            <div class="estudante-div">
                <img class="estudante-imagem" src="estudante_menina.png" alt="Aluno 4">
                <h3 class="estudante-nome">Aluno 4</h3>
                <div>
                    <img class="estudante-icone" src="instagram.png" alt="Instagram">
                    <img class="estudante-icone" src="facebook.png" alt="Facebook">
                </div>
            </div>

        </div>
    </section>

    <!-- Rodapé -->
    <footer class="escola">
        <img class="logo_rodape" src="logo_nossa_escola.png" alt="Logo rodapé">

        <h2 class="escola-titulo">
            Mais informações entre em contato
        </h2>

        <p>41 9.9999-9999</p>
        <p>©2025 | Curso de ADS | Todos os direitos reservados</p>
    </footer>

</body>
</html>
